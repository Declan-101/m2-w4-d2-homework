<!DOCTYPE html>
<html lang="en">
<head>
    <title>Food Blog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
        }

        #leftside {
            float: left;
            width: 30%;
            min-height: 1200px;
            background-color: rgb(77, 192, 154);
        }

        #rightside {
            float: left;
            width: 70%;
            min-height: 1200px;
            background-color: rgb(238, 226, 192);
            position: relative;
        }

        #container {
            background-color: rgba(255, 255, 255, 0.85);
            position: absolute;
            top: 10%;
            left: 15%;
            width: 1100px;
            min-height: 1050px;
            border-radius: 0.7em;
        }

        header {
            height: 100px;
            background-color: rgba(231, 229, 229, 0.5);
            font-size: 2.75em;
            padding: 0.5em;
            color: rgb(216, 150, 7);
        }

        header span {
            font-family: 'Sacramento', cursive;
        }

        main {
            position: relative;
        }

        main h2 {
            position: absolute;
            left: 20%;
            top: 30px;
            margin: 25px 0 200px 50px;
            color: rgb(60, 190, 160);
            text-transform: uppercase;
        }

        main #photos img {
            margin: 0.75em;
            border: 0.85em solid rgb(255, 255, 255);
        }

        section#blogposts {
            position: absolute;
            left: 20%;
            top: 70px;
            width: 80%;
            padding: 50px;
        }

        main .post {
            margin: 25px;
            padding: 25px;
            border: 2px solid rgba(83, 78, 58, 0.6);
            border-radius: 0.5em;
        }

        .profile {
            width: 38px;
            height: 32px;
            margin-right: 15px;
            vertical-align: middle;
            cursor: pointer;
        }

        .author {
            cursor: pointer;
        }

        .post p {
            margin-bottom: 0;
        }

        .author-modal {
            position: fixed;
            z-index: 10;
            top: 50%;
            left: 50%;
            width: 230px;
            min-height: 280px;
            padding: 25px;
            color: white;
            background-color: rgba(0, 0, 0, 0.9);
            border-radius: 1em;
            transform: translate(-50%, -50%);
        }

        .author-modal h2 {
            margin: 0 0 20px;
            font-size: 1.75em;
        }

        .author-modal p {
            margin: 8px 0;
        }

        .close-x {
            position: absolute;
            top: 10px;
            right: 15px;
            color: white;
            background: transparent;
            border: 0;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
        }

        .close-button {
            margin-top: 15px;
            cursor: pointer;
        }

        footer {
            position: absolute;
            bottom: 0;
            height: 50px;
            width: 100%;
            text-align: center;
            font-size: 0.85em;
        }
    </style>
</head>

<body>
    <aside id="leftside"></aside>
    <aside id="rightside"></aside>

    <div id="container">
        <header>
            <span>Food Blog</span>
        </header>

        <main>
            <aside id="photos">
                <img
                    src="images/chili.jpg"
                    alt="White Chicken Chili"
                    width="180"
                >
            </aside>

            <h2>Comments</h2>

            <section id="blogposts">
                <div
                    class="post"
                    v-for="post in posts"
                    :key="post.author"
                >
                    <img
                        class="profile"
                        src="wk4-day2-homework/profile.png"
                        :alt="post.author + ' profile'"
                        title="View author information"
                        tabindex="0"
                        @click="showAuthor(post)"
                        @keydown.enter="showAuthor(post)"
                    >

                    <span
                        class="author"
                        tabindex="0"
                        @click="showAuthor(post)"
                        @keydown.enter="showAuthor(post)"
                    >{{ post.author }}</span> —

                    <span class="date">{{ post.date }}</span>
                    <span class="reply">REPLY</span>

                    <p>{{ post.comment }}</p>
                </div>
            </section>
        </main>

        <div class="author-modal" v-if="selectedAuthor">
            <button
                class="close-x"
                type="button"
                aria-label="Close"
                @click="closeAuthor"
            >&times;</button>

            <h2>{{ selectedAuthor.author }}</h2>

            <p>
                <strong>Foodie Level:</strong>
                {{ selectedAuthor.foodieLevel }}
            </p>

            <p>
                <strong>Bio:</strong><br>
                {{ selectedAuthor.bio }}
            </p>

            <button
                class="close-button"
                type="button"
                @click="closeAuthor"
            >Close</button>
        </div>

        <footer>
            &copy; Copyright FOOD BLOG
        </footer>
    </div>

    <script>
        new Vue({
            el: '#container',

            data: {
                selectedAuthor: null,

                posts: [
                    {
                        author: 'Brianna',
                        date: 'February 18, 2021 @ 3:30 pm',
                        comment: 'Was amazing! My Walmart didn’t have coriander in stock and didn’t have ground cumin. I used serrano instead of jalapeño. It was just like my favorite tortilla soup from BJs. I am sending this recipe to my family. I want everyone to try it!',
                        foodieLevel: 'Novice',
                        bio: 'Food enthusiast. Love to cook and experiment. Into only organic, fat free, sugar free stuffs!'
                    },
                    {
                        author: 'LINH',
                        date: 'February 15, 2021 @ 9:46 am',
                        comment: 'I just made this soup today and it’s so tasty! didn’t have corn at home but still turned out very good. It’s a winner! I made beef chili for my parents; but since my dad has gout he can’t eat beef; this white chicken chili is perfect for him. Thank you Lisa!',
                        foodieLevel: 'Newcomer',
                        bio: 'Love food! Grew up with meat and potatoes. Recently venture outside my comfort zone. Loving everything I have been eating so far. Thai is my favorite at this time.'
                    },
                    {
                        author: 'CATHERINE LEONARDO',
                        date: 'February 13, 2021 @ 12:58 pm',
                        comment: 'I LOVE this White Chicken Chili! You are right, it is satiating meal—delicious with toasted bread. Refreshingly different taste than any chicken chili I’ve made in the past. I made it exactly as written and added some chopped zucchini, carrots, and celery. Instead of shredding the chicken, I chopped it into small pieces. It freezes very well. Will be an all-time favorite, for sure.',
                        foodieLevel: 'Mentor',
                        bio: 'I have to say I never was the adventurous type until 2 years ago. My boyfriend, who is of Japanese background, exposed me to other cultural food and I have never look back since!'
                    },
                    {
                        author: 'KALI',
                        date: 'February 13, 2021 @ 11:31 am',
                        comment: 'This recipe is dynamite! My partner usually won’t eat beans but he finished the whole pot (darn was hoping to have some for leftovers haha). This is crowd-pleaser that I am going to add to my regular recipe rotation. Thanks so much, Lisa!',
                        foodieLevel: 'Novice',
                        bio: 'Food is my passion. So is cooking. I love to experiment and try new things. I have to admit I’m a food whore! Invite me over for dinner and I’ll be there!'
                    }
                ]
            },

            methods: {
                showAuthor: function (post) {
                    this.selectedAuthor = post;
                },

                closeAuthor: function () {
                    this.selectedAuthor = null;
                }
            }
        });
    </script>
</body>
</html>
